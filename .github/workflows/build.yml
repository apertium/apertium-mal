name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add Apertium nightly APT repository
        run: curl -sS https://apertium.projectjj.com/apt/install-nightly.sh | sudo bash

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            make \
            apertium \
            apertium-dev \
            hfst \
            cg3

      - name: Run autogen.sh
        run: bash autogen.sh --prefix=/usr/local

      - name: Build
        run: make -j"$(nproc)"
